device_id: pi_01
edge_db_path: edge_node_mock/data/db/edge_mock.sqlite
retained_audio_dir: edge_node_mock/data/retained_audio
raw_audio_mount: /data/petrel_acoustics/raw_audio/doc_ar4/rapanui_AR4_june_2023
raw_audio_glob: "**/*.wav"
source_sample_rates:
  - 32000
  - 48000
perch_sample_rate: 32000
include_partial_final_buffer: false
perch_model_path: null
perch_tfhub_handle: https://www.kaggle.com/models/google/bird-vocalization-classifier/TensorFlow2/perch_v2_cpu/1
perch_label_path: labels/perch_label.csv
nz_bird_label_path: labels/north_island_nz_perch_lablel.csv
embedding_dim: 1536
hub_ingest_url: http://127.0.0.1:8000/ingest_batch
api_key: replace-with-local-dev-key
telemetry_defaults:
  cpu_temp_c: 45.0
  battery_voltage: 12.4
  solar_amps: 0.0
bio_gate_mode: nz_bird_margin
bio_margin_threshold: 0.55
excluded_margin_labels:
  - Water
  - Train
  - Vehicle
max_variable_buffer_frames: 3
perch_window_seconds: 5.0
plot_style:
  start_line_color: lime
  end_line_color: red
  clip_bar_color: lime
  line_alpha: 0.75
  clip_bar_alpha: 0.75
  line_width: 1.6
  clip_bar_height_fraction: 0.06
